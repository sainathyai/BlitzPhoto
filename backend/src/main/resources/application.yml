# BlitzPhoto - Application Configuration
spring:
  application:
    name: blitzphoto-backend
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:blitzphoto}?sslmode=${DB_SSLMODE:require}&ssl=true
    username: ${DB_USERNAME:rapidphoto}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 500MB
      file-size-threshold: 2KB
  
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=10m,recordStats
  
  security:
    user:
      name: admin
      password: ${ADMIN_PASSWORD:admin123}

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# Management & Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# OpenAPI/Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true

# Application-specific Configuration
blitzphoto:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:19006,http://sainathyai-frontend-dev.s3-website-us-west-2.amazonaws.com,https://blitzphoto.sainathyai.com}
      allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      allowed-headers: "*"
      allow-credentials: true
    jwt:
      secret: ${JWT_SECRET:your-secret-key-change-me-in-production-at-least-256-bits}
      expiration-ms: 3600000  # 1 hour (improved from 15 minutes for better UX)
      refresh-expiration-ms: 604800000  # 7 days
  upload:
    max-files-per-job: 10000  # Effectively unlimited
    max-file-size-mb: 50
    multipart-threshold-mb: 5  # Files >5MB use multipart upload
    allowed-mime-types: image/jpeg,image/png,image/heic,image/webp
    max-concurrent-uploads: 100
  
  aws:
    region: ${AWS_REGION:us-west-2}
    s3:
      uploads-bucket: ${S3_UPLOADS_BUCKET:}
      thumbnails-bucket: ${S3_THUMBNAILS_BUCKET:}
      presigned-url-expiration-minutes: 15
    sqs:
      upload-queue-url: ${SQS_UPLOAD_QUEUE_URL:}
      max-receive-count: 3
  
  image:
    thumbnail:
      width: 300
      height: 300
      quality: 0.85

# Logging
logging:
  level:
    root: INFO
    com.blitzphoto: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

