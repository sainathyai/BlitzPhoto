# Production Profile Configuration
spring:
  jpa:
    show-sql: false
  
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10

logging:
  level:
    root: WARN
    com.blitzphoto: INFO
    org.springframework: WARN
    org.hibernate: WARN

rapidphoto:
  aws:
    s3:
      presigned-url-expiration-minutes: 10  # Shorter in production
  
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}  # Must be explicitly set in production

server:
  error:
    include-stacktrace: never
    include-exception: false

