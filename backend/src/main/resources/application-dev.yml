# Development Profile Configuration
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

logging:
  level:
    root: INFO
    com.blitzphoto: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

blitzphoto:
  security:
    cors:
      allowed-origins: "http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:19006,http://sainathyai-frontend-dev.s3-website-us-west-2.amazonaws.com,https://blitzphoto.sainathyai.com"  # Allow dev origins, S3 frontend, and CloudFront domain

